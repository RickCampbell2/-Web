<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="range-container">

  <label>
    開始:
    <span id="min-value">1</span>
  </label>

  <input
    type="range"
    id="min-range"
    min="1"
    max="285"
    value="1"
  >

  <label>
    終了:
    <span id="max-value">285</span>
  </label>

  <input
    type="range"
    id="max-range"
    min="1"
    max="285"
    value="285"
  >

</div>
    <div class="container">

    <h1>解剖生理</h1>

    <h2 id="question"></h2>

    <img id="question-image">

    <div id="answers"></div>

    <button id="submit-btn">
      回答する
    </button>
    <button id="next-btn">
    次の問題
    </button>

    <p id="result"></p>

  </div>

  <script src="scripts.js"></script>


</body>
</html>
